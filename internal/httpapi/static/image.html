<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Key}} · MCPic</title>
<style>
:root{
  --void:#08090a; --carbon:#0f1011; --obsidian:#161718;
  --graphite:#23252a; --smoke:#383b3f; --ash:#62666d;
  --fog:#8a8f98; --mist:#d0d6e0; --bone:#e5e5e6; --paper:#ffffff;
  --acid-lime:#e4f222;
  --font-sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--mist);font-family:var(--font-sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--mist);text-decoration:none}
a:hover{color:var(--paper)}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-size:16px;font-weight:600;color:var(--paper);letter-spacing:-.011em}
.logo span{color:var(--acid-lime)}
.pill{background:rgba(255,255,255,.05);color:var(--fog);border-radius:9999px;padding:4px 12px;font-size:12px;font-family:var(--font-mono)}
.stage{margin:32px 0 16px;background:var(--carbon);border-radius:12px;box-shadow:inset 0 0 0 1px var(--graphite);padding:24px;display:flex;justify-content:center}
.stage img{max-width:100%;max-height:70vh;border-radius:6px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.badge{background:rgba(255,255,255,.05);color:var(--fog);border-radius:9999px;padding:4px 12px;font-size:12px}
.badge b{color:var(--mist);font-weight:500;font-family:var(--font-mono)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:48px}
.btn-primary{background:var(--acid-lime);color:var(--void);border:none;border-radius:6px;padding:10px 16px;font-size:14px;font-weight:550;letter-spacing:-.011em;font-family:var(--font-sans);cursor:pointer}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:transparent;border:1px solid var(--graphite);color:var(--mist);border-radius:6px;padding:8px 12px;font-size:13px;font-family:var(--font-sans);cursor:pointer}
.btn-ghost:hover{border-color:var(--smoke);color:var(--paper)}
.md{background:var(--obsidian);border:1px solid var(--graphite);border-radius:6px;padding:14px 16px;font-family:var(--font-mono);font-size:13px;color:var(--mist);overflow-x:auto;white-space:pre;flex:1;min-width:280px}
</style>
</head>
<body>
<div class="wrap">
<nav>
  <a class="logo" href="/">MCP<span>ic</span></a>
  <span class="pill">{{.Key}}</span>
</nav>

<div class="stage"><img src="{{.RawURL}}" alt="{{.Key}}"></div>

<div class="meta">
  <span class="badge">格式 <b>{{.Format}}</b></span>
  <span class="badge">尺寸 <b>{{.Width}}×{{.Height}}</b></span>
  <span class="badge">大小 <b>{{.Size}}</b></span>
  <span class="badge">key <b>{{.Key}}</b></span>
</div>

<div class="actions">
  <button class="btn-primary" id="copy-md">复制 Markdown</button>
  <button class="btn-ghost" id="copy-url">复制 URL</button>
  <a class="btn-ghost" href="{{.RawURL}}" download>下载原图</a>
</div>

<div class="md" id="md-text">{{.Markdown}}</div>
</div>
<script>
function copy(t,btn,label){
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(function(){
    var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta);
  });
  var o=btn.textContent;btn.textContent='已复制';setTimeout(function(){btn.textContent=o||label},1200);
}
document.getElementById('copy-md').addEventListener('click',function(){copy({{.JSMarkdown}},this)});
document.getElementById('copy-url').addEventListener('click',function(){copy({{.JSURL}},this)});
</script>
</body>
</html>
